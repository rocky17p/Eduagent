<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Main Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="50%" stop-color="#7c3aed" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>

    <!-- Glass Overlay Gradient -->
    <linearGradient id="glass-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>

    <!-- Cap Highlight Gradient -->
    <linearGradient id="cap-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e0e7ff" />
    </linearGradient>

    <!-- Tassel / Gold Accent Gradient -->
    <linearGradient id="gold-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Squircle -->
  <rect x="32" y="32" width="448" height="448" rx="104" fill="url(#bg-grad)" />
  <rect x="32" y="32" width="448" height="448" rx="104" fill="url(#glass-grad)" />
  <rect x="32" y="32" width="448" height="448" rx="104" fill="none" stroke="#ffffff" stroke-opacity="0.2" stroke-width="6" />

  <!-- Graduation Cap (Mortarboard Base) -->
  <g transform="translate(0, 16)">
    <!-- Skull Cap Underneath -->
    <path d="M192 270 V320 C192 345 220 365 256 365 C292 365 320 345 320 320 V270 Z" fill="#312e81" opacity="0.6" />
    <path d="M200 275 V315 C200 335 225 352 256 352 C287 352 312 335 312 315 V275 Z" fill="url(#cap-grad)" opacity="0.9" />

    <!-- Top Diamond / Plate -->
    <polygon points="256,140 400,210 256,280 112,210" fill="url(#cap-grad)" filter="url(#glow)" />

    <!-- Diamond Under Layer / Shadow -->
    <polygon points="256,148 392,213 256,278 120,213" fill="#ffffff" />

    <!-- Cap Button Top -->
    <ellipse cx="256" cy="210" rx="12" ry="7" fill="url(#gold-grad)" />

    <!-- Tassel Band & String -->
    <path d="M256 210 Q220 220 200 260 T190 310" fill="none" stroke="url(#gold-grad)" stroke-width="8" stroke-linecap="round" />
    
    <!-- Tassel Fringe -->
    <polygon points="184,310 196,310 200,340 180,340" fill="url(#gold-grad)" />

    <!-- AI Sparkle 1 (Top Right) -->
    <path d="M375 140 Q375 160 395 160 Q375 160 375 180 Q375 160 355 160 Q375 160 375 140 Z" fill="#ffffff" opacity="0.9" />
    
    <!-- AI Sparkle 2 (Small Left) -->
    <path d="M140 120 Q140 132 152 132 Q140 132 140 144 Q140 132 128 132 Q140 132 140 120 Z" fill="#fbbf24" opacity="0.85" />
  </g>
</svg>
